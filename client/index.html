<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>空间建图复盘 · Spatial Review</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="app-header"><button class="mobile-menu" id="menu-toggle" aria-label="展开案例列表">☰</button><div class="brand"><span class="brand-mark">◈</span><div><strong>空间建图复盘</strong><small>SPATIAL REVIEW / 实验记录与批注</small></div></div><div class="header-meta"><a class="chat-primary-link" href="/trajectories.html">全部模型轨迹 ↗</a><a class="chat-primary-link" href="/chat.html?run=multiroom-distinct-95516-flash">新版 Flash 探索 ↗</a><span id="snapshot">正在载入实验记录</span><button id="export-notes" class="quiet">导出我的评价 ↓</button></div></header>
<div class="app-layout"><aside class="case-sidebar" id="case-sidebar"><div class="sidebar-heading">实验案例 <span id="case-count"></span></div><input id="case-search" type="search" placeholder="搜索场景编号…" aria-label="搜索案例"><div id="case-list"></div><div class="sidebar-foot">模型输入 · 返回分析 · 实际回执<br>研究者评价独立保存，未反馈给模型。</div></aside>
<main><section class="run-header"><div class="eyebrow" id="case-kind">相同轨迹对照</div><div class="title-row"><h1 id="case-title">载入中</h1><span id="run-status" class="status-pill"></span></div><div class="run-controls"><div id="models" class="segmented"></div><label class="mode-label">输入方式 <select id="mode-select"></select></label></div><p id="run-description" class="description"></p><div id="run-stats" class="stats"></div><p class="trajectory-links"><a id="chat-link" href="/chat.html">打开整条轨迹的聊天视图 ↗</a> <a href="/compare.html">自主探索评分与曲线 ↗</a> <button id="show-complete-output">查看本次完整输出</button></p></section>
<div class="review-layout"><section class="timeline"><div class="segmented timeline-switch"><button id="calls-view" class="selected">模型调用</button><button id="frames-view">观察帧</button></div><input id="timeline-search" type="search" placeholder="搜索调用内容…" aria-label="搜索时间线"><div id="timeline-list"></div></section>
<section class="stage"><div class="step-heading"><div><span id="step-kicker" class="eyebrow"></span><h2 id="step-title"></h2></div><div class="step-nav"><button id="prev-step" title="上一步（K / 左方向键）">←</button><button id="next-step" title="下一步（J / 右方向键）">→</button></div></div><div id="stage-body"></div></section>
<aside class="inspector"><section class="panel"><div class="panel-heading"><h3>研究者评价</h3><span class="soft-tag">离线核查</span></div><div id="research-notes"></div></section><section class="panel my-notes"><div class="panel-heading"><h3>我的评价</h3><span id="save-indicator" role="status">载入中</span></div><p class="hint" id="note-scope">评价绑定到当前步骤</p><select id="note-verdict" aria-label="评价标签"><option value="neutral">普通笔记</option><option value="agree">✓ 认同 / 表现良好</option><option value="issue">! 发现问题</option><option value="question">? 待验证</option></select><textarea id="note-text" placeholder="写下你的判断、疑问或下一轮实验想法…" maxlength="30000" aria-label="我的逐步评价"></textarea><div class="note-actions"><button id="save-note">保存评价</button><button id="reload-note" class="quiet">重新载入</button></div><p id="note-message" class="hint">输入后自动保存；保留本地草稿，云端保存状态会明确显示。</p></section><details class="panel reference-panel"><summary>评测参考 <span class="soft-tag">模型不可见</span></summary><div id="reference-body"></div></details></aside></div></main></div>
<dialog id="image-dialog"><button id="close-image" aria-label="关闭大图">关闭 ×</button><img id="large-image" alt="输入原图放大查看"></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
